[project]
name = "llm-kit"
version = "2.0.0"
description = "LLM を呼ぶときに要る機能（プロバイダの切り替え・構造化出力・ストリーミング・利用量の集計・埋め込み・リランク）をひととおり揃えたライブラリ"
readme = "README.md"
# 3.10 と 3.12 で検査が通ることを 2026-11-19 に確かめた。
requires-python = ">=3.10"

# 部品を使った時点で読み込まれるものだけを必須にする（import llm_kit だけでは読まない）。
# 下限は、このライブラリが実際に動いていた環境の版。
dependencies = [
    "langchain-core>=1.5.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.1",
]

# プロバイダごとのライブラリは、使うときに関数の中で import している。使う分だけ入れる。
[project.optional-dependencies]
openai = ["langchain-openai>=1.5.2"]
anthropic = ["langchain-anthropic"]
# get_llm("google") と get_llm("vertex") の両方。Vertex も langchain-google-genai 経由で呼ぶ。
google = ["langchain-google-genai>=4.3.4", "google-auth>=2.56.3"]
# 埋め込みの "vertex" だけが使う。
vertex-embeddings = ["langchain-google-vertexai"]
# get_llm("bedrock") と、リランクの Bedrock 経路。
bedrock = ["langchain-aws", "boto3>=1.43.114"]
cohere = ["cohere"]
all = ["llm-kit[openai,anthropic,google,vertex-embeddings,bedrock,cohere]"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# このリポジトリの直下が、パッケージ llm_kit そのもの（llm_kit/llm_kit/ と二重にしない）。
# 検査（tests/）は配る物に入れない。
[tool.setuptools]
package-dir = {"llm_kit" = "."}
packages = ["llm_kit", "llm_kit.providers"]
